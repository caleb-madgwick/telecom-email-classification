<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 280" width="1110" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Architecture</title>
  <desc id="desc">Synthetic emails pass through a shared prompt and JSON schema to an OpenAI model and an Anthropic model. Both responses are validated for category and escalation decision, saved to results.json, and turned into accuracy, precision, recall, latency and cost metrics.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8C959F"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .title { font-size: 15px; font-weight: 600; fill: #1F2328; }
      .sub { font-size: 12.5px; fill: #59636E; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .arrow { fill: none; stroke: #8C959F; stroke-width: 1.6; marker-end: url(#arrow); }
      .neutral { fill: #F6F8FA; stroke: #D0D7DE; }
      .model { fill: #DDF4FF; stroke: #54AEFF; }
      .check { fill: #FFF8C5; stroke: #D4A72C; }
      .output { fill: #DAFBE1; stroke: #4AC26B; }
    </style>
  </defs>

  <!-- Solid background so the diagram reads in GitHub light and dark themes -->
  <rect x="0.5" y="0.5" width="1109" height="279" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>

  <!-- Arrows -->
  <path class="arrow" d="M170 140 H202"/>
  <path class="arrow" d="M354 140 H371 V80 H386"/>
  <path class="arrow" d="M354 140 H371 V200 H386"/>
  <path class="arrow" d="M538 80 H555 V140 H570"/>
  <path class="arrow" d="M538 200 H555 V140 H570"/>
  <path class="arrow" d="M722 140 H754"/>
  <path class="arrow" d="M906 140 H938"/>

  <!-- Dataset -->
  <rect class="neutral" x="20" y="105" width="150" height="70" rx="8"/>
  <text class="title mono" x="95" y="135" style="font-size:14px;font-weight:600">emails.json</text>
  <text class="sub" x="95" y="155">60 labelled emails</text>

  <!-- Shared prompt -->
  <rect class="neutral" x="204" y="105" width="150" height="70" rx="8"/>
  <text class="title" x="279" y="135">Shared prompt</text>
  <text class="sub" x="279" y="155">+ JSON schema</text>

  <!-- Models -->
  <rect class="model" x="388" y="45" width="150" height="70" rx="8"/>
  <text class="title" x="463" y="75">OpenAI</text>
  <text class="sub mono" x="463" y="95">gpt-6-luna</text>

  <rect class="model" x="388" y="165" width="150" height="70" rx="8"/>
  <text class="title" x="463" y="195">Anthropic</text>
  <text class="sub mono" x="463" y="215">claude-haiku-5-5</text>

  <!-- Validation -->
  <rect class="check" x="572" y="105" width="150" height="70" rx="8"/>
  <text class="title" x="647" y="135">Validate</text>
  <text class="sub" x="647" y="155">category + escalation</text>

  <!-- Saved results -->
  <rect class="neutral" x="756" y="105" width="150" height="70" rx="8"/>
  <text class="title mono" x="831" y="135" style="font-size:14px;font-weight:600">results.json</text>
  <text class="sub" x="831" y="155">saved per email</text>

  <!-- Metrics -->
  <rect class="output" x="940" y="98" width="150" height="84" rx="8"/>
  <text class="title" x="1015" y="126">Metrics</text>
  <text class="sub" x="1015" y="146">accuracy · precision</text>
  <text class="sub" x="1015" y="164">recall · latency · cost</text>
</svg>
